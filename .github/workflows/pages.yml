name: Weboldal telepítése (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Oldal összeállítása (a naplóűrlap azonosítója titkos beállításból)
        env:
          LOG_FORM_ID: ${{ secrets.LOG_FORM_ID }}
          LOG_FORM_ENTRY: ${{ secrets.LOG_FORM_ENTRY }}
        run: |
          mkdir -p _site
          cp index.html style.css app.js questions.js .nojekyll _site/
          sed -i "s|__LOG_FORM_ID__|${LOG_FORM_ID}|; s|__LOG_FORM_ENTRY__|${LOG_FORM_ENTRY}|" _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
